apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websocket-api
  template:
    metadata:
      labels:
        app: websocket-api
    spec:
      containers:
      - name: websocket-api
        image: server-for-mosquito-mosq-server:latest 
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi" 
            cpu: "100m"

