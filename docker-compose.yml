services:
  postgr:
    image: postgres:15
    environment:
      POSTGRES_DB: main_db
      POSTGRES_USER: main_usesr
      POSTGRES_PASSWORD: MainTestAppPass
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U main_usesr -d main_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosq-server:
    build: ./Server-for-Mosquito
    ports:
      - "5008:8080"
    environment:
      
      - DATABASE_URL=Host=postgr;Port=5432;Database=main_db;Username=main_usesr;Password=MainTestAppPass;Ssl Mode=Disable
      # Заставляем сервер слушать на всех интерфейсах, порт 8080
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      postgr:
        condition: service_healthy

volumes:
  pgdata: